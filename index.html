<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Notícias</title>
  <link rel="stylesheet" href="styles/index.css">

  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header class="container">
    <nav id="primary" class="grid grid-flow-col">
      <div>
        <img src="assets/icons/List.svg" alt="icone de menu">
        <strong>Menu</strong>
      </div>

      <div>
        <img src="assets/Logo.svg" alt="Technews logo">
      </div>

      <div>
        <strong>Buscar</strong>
        <img src="assets/icons/MagnifyingGlass.svg" alt="icone de lupa para pesquisa">
      </div>
    </nav>
    <nav id="secondary" class="grid grid-flow-col">
      <a href="#">Inteligência Artificial</a>
      <a href="#">Blockchain</a>
      <a href="#">Hologramas</a>
      <a href="#">Internet</a>
      <a href="#">Vestíveis</a>
      <a href="#">Realidade Aumentada</a>
      <a href="#">Realidade  Virtual</a>
    </nav>
  </header>

  <main class="conatiner">
    <section id="featured" class="grid grid-flow-col gap-16">
      <figure class="card">
        <img src="assets/Images/Image 01.png" alt="Humanoid robot with glowing blue eyes and white-and-blue body standing in a warm, modern bedroom. The robot has a friendly, welcoming expression and appears to be a domestic assistant designed for household tasks. Soft lighting and a neatly made bed create a calm, futuristic domestic atmosphere.">

        <figcaption>
          <span class="content-tag">Robótica</span>
          <h2 class="text-2xl">
            Novo Smartphone Projetor 3D chega ao mercado, transformando a forma como vemos nossas telas!
          </h2>
        </figcaption>
      </figure>

      <div class="grid grid-cols-2 gap-16">
        <figure class="card">
          <img src="assets/Images/Image 02.png" alt="Hand holding a smartphone with glowing blue and pink holographic display showing colorful app icons and interface elements. The device is tilted at an angle against a dark background with soft bokeh lighting, creating a futuristic and tech-forward atmosphere. A small potted plant with green leaves is visible in the lower left corner of the scene.">
          
          <figcaption>
          <span class="content-tag">Hologramas</span>
          <h2 class="text-lg">
            Robôs domésticos começam a ser adotados para tarefas diárias, prometendo mais conforto e eficiência nas residências.
          </h2>
        </figcaption>
        </figure>

        <figure class="card">
          <img src="assets/Images/Image 03.png" alt="6G logo and rocket ship icon with glowing blue and pink neon effects, symbolizing fast wireless technology and innovation, set against a dark background with vibrant light trails creating a sense of speed and forward momentum.">

            <figcaption>
          <span class="content-tag">Internet</span>
          <h2 class="text-lg">
            Tecnologia 6G chega às metrópoles brasileiras, prometendo revolucionar a forma como vivemos e nos comunicamos.        
          </h2>
        </figcaption>
        </figure>

        <figure class="card">
          <img src="assets/Images/Image 04.png" alt="Woman wearing a purple sports top in a forest checking a smartwatch on her wrist. She is smiling while looking at the device, surrounded by tall trees and natural outdoor lighting. The scene conveys an active, health-conscious lifestyle with a sense of wellness and technology integration.">

            <figcaption>
          <span class="content-tag">Vestíveis</span>
          <h2 class="text-lg">
            Empresa lança relógio inteligente capaz de monitorar a saúde mental, oferecendo insights valiosos para o bem-estar pessoal.

          </h2>
        </figcaption>
        </figure>

        <figure class="card">
          <img src="assets/Images/Image 05.png" alt="Two children wearing virtual reality headsets, laughing joyfully while exploring a digital environment. One child wears a yellow jacket on the left, while the other on the right wears a blue denim shirt. The background features a warm, blurred teal and golden tone, creating an immersive and playful atmosphere that conveys wonder, happiness, and the excitement of experiencing cutting-edge technology together.">

            <figcaption>
          <span class="content-tag">Realidade Virtual</span>
          <h2 class="text-lg">
            Escolas adotam a tecnologia VR para proporcionar experiências imersivas, transformando a aprendizagem tradicional.
          </h2>
        </figcaption>
        </figure>
      </div>
    </section>
    <section id="weekly">
      <header class="grid grid-flow-col">
        <h3>Mais lidas da semana</h3>
        <a href="#" class="grid grid-flow-col gap-2">
          <strong>ver tudo</strong>
          <span></span>
        </a>
      </header>

      <div class="grid grid-flow-col gap-16">
        <figure>
          <span class="content-tag">veículos</span>
          <img src="assets/Images/Image 06.png" alt="Image of a modern electric car parked in a sleek garage, with a futuristic design and advanced technology features.">
          <p>
            Protótipo de veículo voador é apresentado, marcando o início da era dos transportes aéreos pessoais.
          </p>
        </figure>

        <figure>
          <span class="content-tag">Hologramas</span>
          <img src="assets/Images/Image 07.png" alt="Image of a modern electric car parked in a sleek garage, with a futuristic design and advanced technology features.">
          <p>
            Plataforma de videoconferência apresenta nova função de hologramas, tornando as chamadas virtuais mais realistas e envolventes.
          </p>
        </figure>

        <figure>
          <span class="content-tag">Realidade virtual</span>
          <img src="assets/Images/Image 08.png" alt="Image of a modern electric car parked in a sleek garage, with a futuristic design and advanced technology features.">
          <p>
            Nova geração de consoles de videogame é lançada, trazendo gráficos ultra-realistas e experiências de jogo totalmente envolventes.
          </p>
        </figure>

        <figure>
          <span class="content-tag">Internet</span>
          <img src="assets/Images/Image 09.png" alt="Image of a modern electric car parked in a sleek garage, with a futuristic design and advanced technology features.">
          <p>
            Projeto busca oferecer internet de alta velocidade em áreas remotas através de satélites.
          </p>
        </figure>
      </div>
    </section>
  </main>
</body>
</html>
